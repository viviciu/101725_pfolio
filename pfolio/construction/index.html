<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/whitecircle.svg" />
    <link rel="icon" type="image/png" href="/whitecircle.png" />

    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* Equalizer play/pause button */
      .eq-button {
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 0.5rem; /* generous hit area around the tiny bars */
        display: flex;
        align-items: center; /* revert option: flex-end (bars grow up from baseline) */
        gap: 3px;
        height: calc(16px + 1rem);
        cursor: pointer !important; /* overrides the global crosshair */
      }
      .eq-bar {
        width: 2px;
        height: 16px;
        background: #b0b0b0;
        transform: scaleY(0.3);
        transform-origin: center; /* revert option: bottom */
        transition: background 0.3s ease;
        animation-play-state: paused;
      }
      .eq-button:hover .eq-bar {
        background: #333333;
      }
      .eq-button.playing .eq-bar {
        animation-play-state: running;
      }
      /* Pseudo-noise: each bar has its own irregular keyframes and a
         non-harmonic duration, so their phases drift and the combined
         pattern doesn't visibly repeat. Negative delays desync the start
         and give the frozen state varied heights. */
      .eq-bar:nth-child(1) { animation: eq-a 1.3s ease-in-out -0.2s infinite; }
      .eq-bar:nth-child(2) { animation: eq-b 1.7s ease-in-out -0.9s infinite; }
      .eq-bar:nth-child(3) { animation: eq-c 2.3s ease-in-out -0.5s infinite; }
      .eq-bar:nth-child(4) { animation: eq-d 1.9s ease-in-out -1.4s infinite; }
      /* Must come AFTER the shorthands above: the animation shorthand
         resets play-state to "running", so re-pause it here */
      .eq-bar:nth-child(n) { animation-play-state: paused; }
      @keyframes eq-a {
        0%   { transform: scaleY(0.35); }
        23%  { transform: scaleY(0.9); }
        41%  { transform: scaleY(0.5); }
        62%  { transform: scaleY(1); }
        80%  { transform: scaleY(0.25); }
        100% { transform: scaleY(0.35); }
      }
      @keyframes eq-b {
        0%   { transform: scaleY(0.7); }
        18%  { transform: scaleY(0.3); }
        44%  { transform: scaleY(0.95); }
        59%  { transform: scaleY(0.4); }
        77%  { transform: scaleY(0.8); }
        100% { transform: scaleY(0.7); }
      }
      @keyframes eq-c {
        0%   { transform: scaleY(0.45); }
        27%  { transform: scaleY(1); }
        49%  { transform: scaleY(0.35); }
        68%  { transform: scaleY(0.75); }
        86%  { transform: scaleY(0.5); }
        100% { transform: scaleY(0.45); }
      }
      @keyframes eq-d {
        0%   { transform: scaleY(0.3); }
        21%  { transform: scaleY(0.65); }
        38%  { transform: scaleY(1); }
        57%  { transform: scaleY(0.4); }
        79%  { transform: scaleY(0.85); }
        100% { transform: scaleY(0.3); }
      }
      @media (prefers-reduced-motion: reduce) {
        .eq-bar:nth-child(n) { animation: none; }
        .eq-button.playing .eq-bar { transform: scaleY(0.8); }
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viviana Staicu</title>
  </head>
  <body>

    <div class="relative isolate flex flex-col h-screen w-screen">
      <div class="flex flex-1 flex-col items-center justify-center text-center p-6">
        <p class="font-suisse font-normal text-cap text-offBlack">under construction</span></p>
        
        <p class="font-suisse font-normal text-cap text-offBlack">please consider taking the time you would have spent here to instead go touch grass</p>
        <p class="font-suisse font-normal text-cap text-offBlack">🌱</p>


        <audio id="bgm" src="/audio/elevator-trim.mp3" preload="none" loop></audio>
        <button id="bgm-toggle" class="eq-button mt-4" aria-label="Play elevator music" title=":)">
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
          <span class="eq-bar"></span>
        </button>
        <p id="bgm-label" class="md:hidden font-diatype font-normal text-xs text-[#b0b0b0]">play</p>
      </div>
      <p class="pb-2 text-center font-suisse font-normal text-[13px] text-offBlack">09.01.26</p>
    </div>

    <script>
      const bgm = document.getElementById("bgm");
      const bgmToggle = document.getElementById("bgm-toggle");
      // Keep the crosshair during clicks: mousedown otherwise begins a
      // text-selection drag and the browser swaps to its default cursor
      // until the next mousemove
      document.addEventListener("mousedown", (e) => e.preventDefault());
      // Whole screen toggles the music; button clicks bubble here too,
      // so one listener covers both without double-toggling
      document.addEventListener("click", () => {
        if (bgm.paused) {
          bgm.play();
        } else {
          bgm.pause();
        }
      });
      // Sync the animation to the audio's real state (covers buffering, track end, etc.)
      const bgmLabel = document.getElementById("bgm-label");
      bgm.addEventListener("play", () => {
        bgmToggle.classList.add("playing");
        bgmToggle.setAttribute("aria-label", "Pause elevator music");
        bgmLabel.textContent = "pause";
      });
      bgm.addEventListener("pause", () => {
        bgmToggle.classList.remove("playing");
        bgmToggle.setAttribute("aria-label", "Play elevator music");
        bgmLabel.textContent = "play";
      });
    </script>

    <!-- VERCEL ANALYTICS INTEGRATION -->
    <!-- https://vercel.com/docs/analytics/quickstart?framework=html&language=js#add-the-analytics-component-to-your-app -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
